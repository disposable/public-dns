name: Publish public DNS data

# Action major versions below were bumped for Node 24 compatibility.
on:
    schedule:
        - cron: "15 2 * * *"
    workflow_dispatch:
        inputs:
            update_submodule:
                description: "Update crawler submodule to latest remote commit"
                required: false
                default: false
                type: boolean
            validation_parallelism:
                description: "Per-VM validation parallelism for shard jobs"
                required: false
                default: 300
                type: number
            commit_message:
                description: "Optional custom commit message"
                required: false
                default: ""
                type: string

permissions:
    contents: write

concurrency:
    group: publish-public-dns
    cancel-in-progress: false

jobs:
    discover-and-split:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            validate_matrix: ${{ steps.validate-matrix.outputs.matrix }}

        steps:
            - name: Checkout repo with submodules
              uses: actions/checkout@v6
              with:
                  submodules: recursive
                  fetch-depth: 0

            - name: Optionally update crawler submodule
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_submodule }}
              run: |
                  git submodule update --init --remote --recursive crawler
                  git status

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

            - name: Install crawler dependencies
              working-directory: crawler
              run: uv sync --group dev

            - name: Prepare stage directories
              run: |
                  mkdir -p stage-inputs/probe-corpus
                  mkdir -p stage-inputs/discovery/chunks
                  mkdir -p stage-inputs/meta
                  mkdir -p stage-inputs/tools
                  rm -rf stage-inputs/probe-corpus/* stage-inputs/discovery/* stage-inputs/meta/*
                  mkdir -p stage-inputs/discovery/chunks

            - name: Install MassDNS build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends build-essential ca-certificates git libldns-dev

            - name: Build MassDNS binary
              run: |
                  git clone --depth 1 https://github.com/blechschmidt/massdns.git /tmp/massdns
                  make -C /tmp/massdns
                  install -m 0755 /tmp/massdns/bin/massdns stage-inputs/tools/massdns
                  stage-inputs/tools/massdns --help >/dev/null

            - name: Generate probe corpus
              working-directory: crawler
              run: >
                  uv run resolver-inventory generate-probe-corpus
                  --config configs/probe-corpus.toml
                  --output ../stage-inputs/probe-corpus

            - name: Validate probe corpus
              working-directory: crawler
              run: >
                  uv run resolver-inventory validate-probe-corpus
                  --config configs/probe-corpus.toml
                  --input ../stage-inputs/probe-corpus/probe-corpus.json
                  --schema-version 2

            - name: Discover candidates
              id: discover
              working-directory: crawler
              run: >
                  uv run resolver-inventory discover
                  --config configs/default.toml
                  --output ../stage-inputs/discovery/candidates.json
                  --filtered-output ../stage-inputs/discovery/filtered.json

            - name: Restore history database from state branch
              run: |
                  mkdir -p meta
                  if git fetch --depth=1 origin state; then
                    git show FETCH_HEAD:meta/history.duckdb > meta/history.duckdb || rm -f meta/history.duckdb
                  else
                    echo "state branch not found; starting with empty history"
                  fi

            - name: Apply historical DNS quarantine
              working-directory: crawler
              run: >
                  uv run python scripts/apply_history_quarantine.py
                  --history-db ../meta/history.duckdb
                  --run-date "$(date -u +%F)"
                  --candidates-input ../stage-inputs/discovery/candidates.json
                  --filtered-input ../stage-inputs/discovery/filtered.json
                  --candidates-output ../stage-inputs/discovery/candidates.json
                  --filtered-output ../stage-inputs/discovery/filtered.json

            - name: Stage history database for downstream jobs
              run: |
                  if [ -f meta/history.duckdb ]; then
                    cp meta/history.duckdb stage-inputs/meta/history.duckdb
                  else
                    echo "no history database available; shards score without history"
                  fi

            - name: Split candidates into shards
              id: split
              working-directory: crawler
              run: >
                  uv run resolver-inventory split-candidates
                  --input ../stage-inputs/discovery/candidates.json
                  --output-dir ../stage-inputs/discovery/chunks
                  --shards 45

            - name: Write crawler SHA
              run: git -C crawler rev-parse HEAD > stage-inputs/meta/crawler-sha.txt

            - name: Build validate matrix
              id: validate-matrix
              run: |
                  SHARDS="${{ steps.split.outputs.shards }}"
                  MATRIX="$(python3 -c "import json, sys; print(json.dumps({'shard': list(range(int(sys.argv[1])))}))" "$SHARDS")"
                  echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

            - name: Report discovery results
              run: |
                  echo "Candidates discovered: ${{ steps.discover.outputs.candidates_total }}"
                  echo "Filtered before validation: ${{ steps.discover.outputs.filtered_total }}"
                  echo "Shard count: ${{ steps.split.outputs.shards }}"
                  echo "Discovery manifest: ${{ steps.split.outputs.manifest_path }}"

            - name: Upload stage inputs
              uses: actions/upload-artifact@v6
              with:
                  name: crawler-stage-inputs
                  path: stage-inputs/

    validate-shards:
        runs-on: ubuntu-latest
        timeout-minutes: 120
        needs: [discover-and-split]
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.discover-and-split.outputs.validate_matrix) }}

        steps:
            - name: Checkout repo with submodules
              uses: actions/checkout@v6
              with:
                  submodules: recursive
                  fetch-depth: 0

            - name: Download stage inputs
              uses: actions/download-artifact@v7
              with:
                  name: crawler-stage-inputs
                  path: stage-inputs

            - name: Pin crawler submodule to staged SHA
              run: |
                  SHA="$(cat stage-inputs/meta/crawler-sha.txt)"
                  git -C crawler fetch origin "$SHA"
                  git -C crawler checkout "$SHA"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

            - name: Install crawler dependencies
              working-directory: crawler
              run: uv sync --group dev

            - name: Validate shard
              id: validate
              env:
                  VALIDATION_PARALLELISM: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_parallelism || 300 }}
              run: |
                  SHARD="$(printf '%02d' "${{ matrix.shard }}")"
                  mkdir -p validated-shards
                  chmod +x stage-inputs/tools/massdns
                  cd crawler
                  uv run resolver-inventory validate \
                    --config configs/default.toml \
                    --input ../stage-inputs/discovery/chunks/chunk-"${SHARD}".json \
                    --probe-corpus ../stage-inputs/probe-corpus/probe-corpus.json \
                    --validation-parallelism "${VALIDATION_PARALLELISM}" \
                    --dns-backend massdns \
                    --massdns-bin ../stage-inputs/tools/massdns \
                    --history-db ../stage-inputs/meta/history.duckdb \
                    --run-date "$(date -u +%F)" \
                    --output ../validated-shards/shard-"${SHARD}".json

            - name: Upload validated shard
              uses: actions/upload-artifact@v6
              with:
                  name: validated-shard-${{ matrix.shard }}
                  path: validated-shards/

    merge-and-publish:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [discover-and-split, validate-shards]

        steps:
            - name: Checkout repo with submodules
              uses: actions/checkout@v6
              with:
                  submodules: recursive
                  fetch-depth: 0

            - name: Download stage inputs
              uses: actions/download-artifact@v7
              with:
                  name: crawler-stage-inputs
                  path: stage-inputs

            - name: Download validated shards
              uses: actions/download-artifact@v7
              with:
                  pattern: validated-shard-*
                  path: validated-shards
                  merge-multiple: true

            - name: Pin crawler submodule to staged SHA
              run: |
                  SHA="$(cat stage-inputs/meta/crawler-sha.txt)"
                  git -C crawler fetch origin "$SHA"
                  git -C crawler checkout "$SHA"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

            - name: Install crawler dependencies
              working-directory: crawler
              run: uv sync --group dev

            - name: Prepare output directories
              run: |
                  mkdir -p _build json txt probe-corpus
                  rm -rf _build/* json/* txt/* probe-corpus/*

            - name: Materialize final outputs
              id: materialize
              working-directory: crawler
              run: >
                  uv run resolver-inventory materialize-results
                  --config configs/default.toml
                  --inputs-glob "../validated-shards/*.json"
                  --filtered-input ../stage-inputs/discovery/filtered.json
                  --split-json-max-bytes 40000000
                  --output ../_build

            - name: Copy probe corpus artifacts
              run: cp -R stage-inputs/probe-corpus/. probe-corpus/

            - name: Report merge results
              run: |
                  echo "Accepted: ${{ steps.materialize.outputs.results_accepted }}"
                  echo "Candidate: ${{ steps.materialize.outputs.results_candidate }}"
                  echo "Rejected: ${{ steps.materialize.outputs.results_rejected }}"
                  echo "Filtered: ${{ steps.materialize.outputs.filtered_total }}"
                  echo "Validated shards: ${{ steps.materialize.outputs.validated_shards }}"
                  echo "Output directory: ${{ steps.materialize.outputs.output_dir }}"

            - name: Copy published assets into repository root
              run: |
                  shopt -s nullglob

                  for file in _build/*.json; do
                    cp "$file" json/
                  done

                  for file in _build/*.txt _build/*.conf; do
                    cp "$file" txt/
                  done

            - name: Write metadata
              run: |
                  mkdir -p meta
                  {
                    echo "{"
                    echo "  \"generated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
                    echo "  \"workflow\": \"${GITHUB_WORKFLOW}\","
                    echo "  \"run_id\": \"${GITHUB_RUN_ID}\","
                    echo "  \"sha\": \"${GITHUB_SHA}\""
                    echo "}"
                  } > meta/build.json

            - name: Update history database
              working-directory: crawler
              run: >
                  uv run python scripts/update_history.py
                  --history-db ../stage-inputs/meta/history.duckdb
                  --accepted-input ../_build/accepted.json
                  --candidate-input ../_build/candidate.json
                  --rejected-input ../_build/rejected.json
                  --filtered-input ../_build/filtered.json
                  --meta-build ../meta/build.json
                  --crawler-sha-file ../stage-inputs/meta/crawler-sha.txt

            - name: Generate run changelog
              working-directory: crawler
              run: >
                  uv run python scripts/generate_changelog.py
                  --history-db ../stage-inputs/meta/history.duckdb
                  --output ../meta/changelog.json

            - name: Generate README statistics
              working-directory: crawler
              run: >
                  uv run python scripts/generate_stats_report.py
                  --history-db ../stage-inputs/meta/history.duckdb
                  --readme ../README.md

            - name: Push history database to state branch
              run: |
                  if git fetch --depth=1 origin state; then
                    git worktree add ../state-worktree FETCH_HEAD --detach
                  else
                    git worktree add --orphan state ../state-worktree
                  fi
                  mkdir -p ../state-worktree/meta
                  cp stage-inputs/meta/history.duckdb ../state-worktree/meta/history.duckdb
                  git -C ../state-worktree add meta/history.duckdb
                  if git -C ../state-worktree diff --cached --quiet; then
                    echo "history database unchanged"
                    exit 0
                  fi
                  git -C ../state-worktree -c user.name="github-actions[bot]" \
                    -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                    commit -m "chore(state): update resolver history"
                  git -C ../state-worktree push origin HEAD:state

            - name: Commit and push if changed
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add README.md json txt probe-corpus meta crawler

                  if git diff --cached --quiet; then
                    echo "No changes to commit"
                    exit 0
                  fi

                  MSG="${{ inputs.commit_message }}"
                  if [ -z "$MSG" ]; then
                    MSG="chore(data): refresh public DNS assets"
                  fi

                  git commit -m "$MSG"

                  # main may have moved while shards validated; rebase and retry
                  for attempt in 1 2 3; do
                    if git push origin HEAD:main; then
                      exit 0
                    fi
                    if [ "$attempt" -eq 3 ]; then
                      echo "push still rejected after $attempt attempts"
                      exit 1
                    fi
                    echo "push rejected; rebasing onto latest origin/main (attempt $attempt)"
                    git fetch origin main
                    git rebase -X theirs origin/main
                  done
